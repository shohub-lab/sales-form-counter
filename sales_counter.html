<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101a30"><title>営業フォーム カウンター</title><style>*{box-sizing:border-box}body{margin:0;background:#0d1425;color:#f4f7ff;font-family:-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN',sans-serif}main{max-width:520px;margin:auto;padding:30px 18px}h1{font-size:23px;margin:8px 0}p{color:#aebbd1}.date{margin:20px 0}input{background:#202b43;color:white;border:1px solid #52617d;border-radius:10px;padding:12px;font-size:16px;width:100%}.cards{display:grid;grid-template-columns:1fr 1fr;gap:12px}.card{background:#1b2942;border-radius:18px;padding:16px 12px;text-align:center}.num{font-size:48px;font-weight:750;margin:12px 0}.good{color:#6ee5b1}.bad{color:#ffa1a1}button{cursor:pointer;border:0;border-radius:12px;padding:13px 9px;font-size:15px;font-weight:650;width:100%;margin-top:9px}.plusgood{background:#38c58a;color:#092a1d}.plusbad{background:#ff8585;color:#35151b}.minus{background:#35425c;color:#f1f5ff}.summary{background:#1b2942;border-radius:18px;padding:20px;margin-top:18px;line-height:2}.summary strong{font-size:24px}.row{display:flex;justify-content:space-between;gap:10px}.small{font-size:13px;color:#aebbd1;margin-top:20px}.danger{background:transparent;color:#ffb3b3;border:1px solid #80515b}.export{background:#3b568b;color:white}a{color:#a7c6ff}</style></head><body><main><h1>📨 お問い合わせ送信カウンター</h1><p>毎日の営業フォーム作業を記録</p><div class="date"><label for="day">記録する日付</label><input id="day" type="date"></div><div class="cards"><section class="card"><div class="good">✓ 送信完了</div><div class="num good" id="sent">0</div><button class="plusgood" id="addSent">＋ 1件追加</button><button class="minus" id="subSent">− 取り消し</button></section><section class="card"><div class="bad">× 送信不可</div><div class="num bad" id="failed">0</div><button class="plusbad" id="addFailed">＋ 1件追加</button><button class="minus" id="subFailed">− 取り消し</button></section></div><div class="summary"><div class="row"><span>合計処理件数</span><strong id="total">0 件</strong></div><div class="row"><span>送信成功率</span><strong id="rate">—</strong></div></div><button class="export" id="export">記録をCSVで保存</button><button class="danger" id="reset">この日の記録をリセット</button><p class="small">記録はこのブラウザのローカル保存領域に保存されます。ブラウザのデータ消去・プライベートブラウズ・別端末では引き継がれない場合があります。定期的にCSV保存してください。営業禁止の注意書きも送信前に確認しよう。</p></main><script>const key='shou-sales-counter-v1';let data={};try{data=JSON.parse(localStorage.getItem(key)||'{}')||{}}catch{}const $=id=>document.getElementById(id);const now=new Date();$('day').value=[now.getFullYear(),String(now.getMonth()+1).padStart(2,'0'),String(now.getDate()).padStart(2,'0')].join('-');function get(){return data[$('day').value]||{sent:0,failed:0}}function render(){const x=get(),t=x.sent+x.failed;$('sent').textContent=x.sent;$('failed').textContent=x.failed;$('total').textContent=t+' 件';$('rate').textContent=t?(x.sent/t*100).toFixed(1)+'%':'—'}function update(field,delta){const x={...get()};x[field]=Math.max(0,x[field]+delta);data[$('day').value]=x;try{localStorage.setItem(key,JSON.stringify(data))}catch{alert('保存できませんでした。CSVで控えてください。')}render()}$('day').onchange=render;$('addSent').onclick=()=>update('sent',1);$('subSent').onclick=()=>update('sent',-1);$('addFailed').onclick=()=>update('failed',1);$('subFailed').onclick=()=>update('failed',-1);$('reset').onclick=()=>{if(confirm('選択した日付の記録を0件に戻しますか？')){data[$('day').value]={sent:0,failed:0};localStorage.setItem(key,JSON.stringify(data));render()}};$('export').onclick=()=>{const rows=[['日付','送信完了','送信不可','合計','成功率']];Object.keys(data).sort().forEach(d=>{const x=data[d],t=x.sent+x.failed;rows.push([d,x.sent,x.failed,t,t?(x.sent/t*100).toFixed(1)+'%':'—'])});const csv='\ufeff'+rows.map(r=>r.join(',')).join('\r\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='営業フォーム記録.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};render();</script></body></html>
